name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test beatsaber-frame-fixes.slnx

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Publish
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir dist
          for rid in linux-arm64 linux-x64; do
            dotnet publish src/BeatSaberFrameFixes -c Release -r "$rid" -p:Version="$version" -o "publish/$rid"
            cp "publish/$rid/beatsaber-frame-fixes" "dist/beatsaber-frame-fixes-$rid"
          done
          cd dist && sha256sum beatsaber-frame-fixes-* > SHA256SUMS
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
